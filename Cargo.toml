[workspace]
resolver = "2"
members = [
    "crates/wiretap-core",
    "crates/wiretap-sinks",
    "crates/wiretap-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Iwetan77/wiretap"
homepage = "https://github.com/Iwetan77/wiretap"
authors = ["Kaizen Labs"]
rust-version = "1.80"

# cargo-dist (https://opensource.axo.dev/cargo-dist/) configuration. Drives
# the tagged-release GitHub Actions workflow below.
[workspace.metadata.dist]
cargo-dist-version = "0.22.1"
ci = "github"
installers = ["shell", "powershell"]
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]
pr-run-mode = "plan"
install-updater = false
# Only build for the bin crate.
default-features = false

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
tonic-build = { version = "0.12", default-features = false, features = ["prost", "transport"] }
prost = "0.13"
prost-types = "0.13"
protoc-bin-vendored = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.32", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros", "chrono"] }
async-trait = "0.1"
futures = "0.3"
bytes = "1"
hex = "0.4"
bloomfilter = "1.0"
base64 = "0.22"
bcs = "0.1"
lru = "0.12"
serde_with = "3"
