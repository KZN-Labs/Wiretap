name: release

# Hand-rolled tagged-release workflow. Builds the `wiretap` binary on all
# 5 targets, uploads to a GitHub Release, and produces shell + PowerShell
# installer one-liners.
#
# To migrate to cargo-dist, run `dist init` locally — the
# `[workspace.metadata.dist]` block in Cargo.toml is preconfigured.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  BIN: wiretap

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            ext: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
            ext: ""
          - target: x86_64-apple-darwin
            os: macos-13
            cross: false
            ext: ""
          - target: aarch64-apple-darwin
            os: macos-14
            cross: false
            ext: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - name: install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: install cross (linux aarch64)
        if: matrix.cross
        run: cargo install cross --locked

      - name: cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: build
        shell: bash
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} --package wiretap-sui
          else
            cargo build --release --target ${{ matrix.target }} --package wiretap-sui
          fi

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "${GITHUB_REF_NAME}" ]; then
            version="0.0.0-dev"
          fi
          stem="wiretap-sui-${version}-${{ matrix.target }}"
          mkdir -p "dist/${stem}"
          cp "target/${{ matrix.target }}/release/${BIN}${{ matrix.ext }}" "dist/${stem}/"
          cp README.md LICENSE "dist/${stem}/"
          case "${{ matrix.target }}" in
            *windows*) (cd dist && 7z a "${stem}.zip" "${stem}") ;;
            *)         tar -C dist -czf "dist/${stem}.tar.gz" "${stem}" ;;
          esac

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  release:
    name: publish github release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: write installer one-liners
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}"

          cat > dist/wiretap-sui-installer.sh <<EOF
          #!/usr/bin/env sh
          # wiretap-sui shell installer.
          set -eu
          tag="${tag}"
          base="${base}"
          os=\$(uname -s)
          arch=\$(uname -m)
          case "\$os/\$arch" in
            Linux/x86_64)   triple=x86_64-unknown-linux-gnu ;;
            Linux/aarch64)  triple=aarch64-unknown-linux-gnu ;;
            Linux/arm64)    triple=aarch64-unknown-linux-gnu ;;
            Darwin/x86_64)  triple=x86_64-apple-darwin ;;
            Darwin/arm64)   triple=aarch64-apple-darwin ;;
            *) echo "unsupported platform: \$os/\$arch" >&2; exit 1 ;;
          esac
          stem="wiretap-sui-${version}-\${triple}"
          tmp=\$(mktemp -d)
          trap 'rm -rf "\$tmp"' EXIT
          curl --proto '=https' --tlsv1.2 -fLsS "\${base}/\${stem}.tar.gz" -o "\${tmp}/p.tgz"
          tar -C "\${tmp}" -xzf "\${tmp}/p.tgz"
          dest="\${WIRETAP_INSTALL_DIR:-\${CARGO_HOME:-\$HOME/.cargo}/bin}"
          mkdir -p "\${dest}"
          install -m 0755 "\${tmp}/\${stem}/wiretap" "\${dest}/wiretap"
          echo "installed \${dest}/wiretap"
          EOF
          chmod +x dist/wiretap-sui-installer.sh

          cat > dist/wiretap-sui-installer.ps1 <<EOF
          # wiretap-sui PowerShell installer.
          \$ErrorActionPreference = 'Stop'
          \$tag = '${tag}'
          \$base = '${base}'
          \$triple = 'x86_64-pc-windows-msvc'
          \$stem = "wiretap-sui-${version}-\$triple"
          \$tmp = New-Item -ItemType Directory -Path (Join-Path \$env:TEMP ([System.Guid]::NewGuid()))
          try {
            \$zip = Join-Path \$tmp 'p.zip'
            Invoke-WebRequest "\$base/\$stem.zip" -OutFile \$zip
            Expand-Archive \$zip -DestinationPath \$tmp
            \$dest = if (\$env:WIRETAP_INSTALL_DIR) { \$env:WIRETAP_INSTALL_DIR } elseif (\$env:CARGO_HOME) { Join-Path \$env:CARGO_HOME 'bin' } else { Join-Path \$env:USERPROFILE '.cargo\bin' }
            New-Item -ItemType Directory -Path \$dest -Force | Out-Null
            Copy-Item (Join-Path \$tmp "\$stem\wiretap.exe") -Destination (Join-Path \$dest 'wiretap.exe') -Force
            Write-Host "installed \$(Join-Path \$dest 'wiretap.exe')"
          } finally {
            Remove-Item \$tmp -Recurse -Force
          }
          EOF

      - name: create github release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/wiretap-sui-installer.sh
            dist/wiretap-sui-installer.ps1
          generate_release_notes: true
