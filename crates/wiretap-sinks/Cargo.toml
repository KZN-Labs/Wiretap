[package]
name = "wiretap-sinks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Sinks for wiretap: sqlite (default), postgres (feature), webhook, stdout NDJSON."
readme = "../../README.md"
keywords = ["sui", "indexer", "grpc", "blockchain", "events"]
categories = ["cryptography::cryptocurrencies", "database", "asynchronous"]

[features]
default = ["sqlite", "webhook", "stdout"]
sqlite = ["dep:rusqlite"]
postgres = ["dep:sqlx"]
webhook = ["dep:reqwest"]
stdout = []

[dependencies]
wiretap-core = { path = "../wiretap-core", version = "0.1.0" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true
anyhow.workspace = true
rusqlite = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
